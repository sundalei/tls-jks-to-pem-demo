# Scenario 2: the jar still contains the keystore lines (legacy profile),
# and the placeholders are still defined, but a PEM bundle is added on top.
# Expected: the bundle wins and the JKS is no longer served.
user.keystore=file:./certs/jks/demo.jks
user.password=changeit

# One combined PEM file (certificate + private key) used for both properties.
server.ssl.bundle=gateway
spring.ssl.bundle.pem.gateway.keystore.certificate=file:./certs/pem/demo-host.pem
spring.ssl.bundle.pem.gateway.keystore.private-key=file:./certs/pem/demo-host.pem
