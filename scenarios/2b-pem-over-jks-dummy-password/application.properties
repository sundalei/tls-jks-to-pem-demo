# Scenario 2b: same as scenario2, but with a wrong keystore password.
# Expected: startup still succeeds and the PEM identity is served, which
# shows the JKS is not opened at all (scenario 1b shows the same wrong
# password is fatal when the JKS is in use).
user.keystore=file:./certs/jks/demo.jks
user.password=not-used-dummy

server.ssl.bundle=gateway
spring.ssl.bundle.pem.gateway.keystore.certificate=file:./certs/pem/demo-host.pem
spring.ssl.bundle.pem.gateway.keystore.private-key=file:./certs/pem/demo-host.pem
