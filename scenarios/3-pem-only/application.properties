# Scenario 3: the target state. No keystore lines in the jar (the "legacy"
# profile is not activated), no JKS, no keystore password.
server.ssl.bundle=gateway
spring.ssl.bundle.pem.gateway.keystore.certificate=file:./certs/pem/demo-host.pem
spring.ssl.bundle.pem.gateway.keystore.private-key=file:./certs/pem/demo-host.pem
# Pick up a renewed certificate when the file changes, without a restart.
spring.ssl.bundle.pem.gateway.reload-on-update=true
